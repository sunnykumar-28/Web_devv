<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width:600px;
            height:300px;
            background-color: blue;
            transition: width 2s, height 2s,background-color 2s;
        }
        div:hover{
            width:400px;
            height:400px;
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>transition property</h1>
    <div>   </div>
</body>
</html>
