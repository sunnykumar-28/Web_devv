<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p
        {
            color: red;
        }
        img
      {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
      }
        
        p.top
        {
            position: fixed;
            top: 0%;
        }
        p.mid
        {
            position: fixed;
            top: 50%;
        }
        p.bottom
        {
            position: fixed;
            bottom: 0;
        }
        *{
            margin: 0;
            padding: 0;
        }
        #centre{
            text-align: center;        }
        #right{
            text-align: right;
        }
        p
        {
            width: 100%;
        }
    </style>
</head>
<body>
    <img src="sunny.jpeg" alt="">
 
    <p class="top" id="centre">sunny kumar</p>
    <p class="top">sunny kumar</p>
    <p class="top" id="right">sunny kumar</p>
    <p class="mid" id="centre">sunny kumar</p>
    <p class="mid">sunny kumar</p>
    <p class="mid" id="right">sunny kumar</p>
    <p class="bottom" id="centre">sunny kumar  </p>
    <p class="bottom">sunny kumar  </p>
    <p class="bottom" id="right">sunny kumar  </p>
</body>
</html>
